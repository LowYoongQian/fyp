name: fyp_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  http: ^1.1.0
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  network_info_plus: ^6.1.1
  permission_handler: ^11.3.1
  sqflite: ^2.3.3
  path: ^1.9.0
  shared_preferences: ^2.3.2
  image_picker: 1.2.3
  image_cropper: 12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS 不允许透明通道，保险起见强制去掉
  remove_alpha_ios: true
  # Android 8.0+ 自适应图标：系统会按厂商形状裁剪（圆形/方形/水滴）
  # 所以前景图内容要收在中间安全区，用的是缩小版那张
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
