name: Build and Release Flutter APK

on:
  push:
    tags:
      - 'v*.*.*'  # 触发条件: git tag v1.0.0 并 push
  workflow_dispatch:  # 也可手动触发

env:
  FLUTTER_VERSION: '3.24.0'  # 改成你项目用的 Flutter 版本
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: ./fyp_flutter
        run: flutter pub get

      - name: Build APK
        working-directory: ./fyp_flutter
        run: flutter build apk --release

      - name: Rename APK with version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mv fyp_flutter/build/app/outputs/flutter-apk/app-release.apk \
             fyp_flutter/build/app/outputs/flutter-apk/smart-attendance-${VERSION}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: fyp_flutter/build/app/outputs/flutter-apk/smart-attendance-*.apk
          body: |
            ## Smart Attendance System - Flutter APK

            **Backend Environment**: Azure (api.smartsystem.live)

            ### Installation
            1. Download the APK below
            2. Enable "Install from unknown sources" on Android
            3. Install and open the app

            ### What's Changed
            - Connected to Azure backend
            - See [commit history](https://github.com/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }}) for details

            ### Backend Status
            - API: https://api.smartsystem.live
            - Web: https://smartsystem.live
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
