name: Flutter APK — Debug-signed FYP demo
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
concurrency:
  group: flutter-apk-${{ github.ref }}
  cancel-in-progress: false
env:
  FLUTTER_VERSION: '3.41.4'
  FYP_ALLOW_DEBUG_RELEASE_SIGNING: '1'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Validate version and configure client
        id: prepare
        working-directory: fyp_flutter
        env:
          FIREBASE_ANDROID_CLIENT_JSON: ${{ secrets.FIREBASE_ANDROID_CLIENT_JSON }}
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64,json,os,re,subprocess
          from pathlib import Path
          m=re.search(r'^version:\s*(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)\+([1-9]\d*)\s*$',Path('pubspec.yaml').read_text(),re.M)
          assert m, 'Expected MAJOR.MINOR.PATCH+positiveVersionCode'
          version='.'.join(m.groups()[:3]); code=int(m[4])
          assert code<=2100000000, 'Android versionCode out of range'
          if os.environ.get('GITHUB_REF_TYPE')=='tag':
              assert os.environ['GITHUB_REF_NAME']=='v'+version, 'Tag must match pubspec version'
          for tag in subprocess.check_output(['git','tag','--list','v*'],text=True,encoding='utf-8').splitlines():
              if tag==os.environ.get('GITHUB_REF_NAME'): continue
              p=subprocess.run(['git','show',tag+':fyp_flutter/pubspec.yaml'],capture_output=True,text=True,encoding='utf-8')
              old=re.search(r'^version:\s*\d+\.\d+\.\d+\+(\d+)\s*$',p.stdout,re.M)
              assert not old or code>int(old[1]), 'versionCode must exceed all earlier tagged builds'
          try:
              raw=os.environ.get('FIREBASE_ANDROID_CLIENT_JSON',''); config=json.loads(raw)
              assert not any(x in raw for x in ['private_key','service_account','service_role','AccountKey=','PRIVATE KEY'])
              assert config['project_info']['project_id']=='fyp-tar'
              assert any(c['client_info'].get('android_client_info',{}).get('package_name')=='com.example.fyp_flutter' for c in config['client'])
              Path('android/app/google-services.json').write_text(json.dumps(config))
              encoded=os.environ.get('ANDROID_DEBUG_KEYSTORE_BASE64','')
              if encoded:
                  key=Path.home()/'.android/debug.keystore';key.parent.mkdir(parents=True,exist_ok=True)
                  key.write_bytes(base64.b64decode(encoded,validate=True));key.chmod(0o600)
                  checked=subprocess.run(['keytool','-list','-keystore',str(key),'-alias','androiddebugkey','-storepass','android'],capture_output=True)
                  assert checked.returncode==0
              else:
                  print('::warning::No fixed Debug keystore: signer may change between runs; uninstall may be required.')
          except Exception:
              raise SystemExit('Missing/invalid Firebase Android client JSON or Debug keystore; details withheld.') from None
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f'version={version}\ncode={code}\n')
          PY
      - name: Refuse existing Release changes
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq -- "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-tags.txt"; then
            echo 'Release already exists; refusing to modify existing APKs.'
            exit 1
          fi
      - name: Dependencies and targeted static analysis
        working-directory: fyp_flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze lib/main.dart lib/services/mobile_push.dart
      - name: Build Release-mode Debug-signed APK
        working-directory: fyp_flutter
        run: |
          flutter build apk --release --target lib/main.dart \
            --build-name=${{ steps.prepare.outputs.version }} --build-number=${{ steps.prepare.outputs.code }} \
            --dart-define=API_BASE_URL=https://api.smartsystem.live \
            --dart-define=EMULATOR_API_BASE_URL=https://api.smartsystem.live
      - name: Verify APK before publication
        env:
          EXPECTED_VERSION: ${{ steps.prepare.outputs.version }}
          EXPECTED_CODE: ${{ steps.prepare.outputs.code }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,re,subprocess
          from pathlib import Path
          from zipfile import ZipFile
          sdk=Path(os.environ.get('ANDROID_HOME') or os.environ['ANDROID_SDK_ROOT'])
          suffix='.exe' if os.name=='nt' else ''
          signer='apksigner.bat' if os.name=='nt' else 'apksigner'
          tools=sorted(p for p in (sdk/'build-tools').iterdir() if (p/('aapt'+suffix)).is_file() and (p/signer).is_file())[-1]
          apk=Path('fyp_flutter/build/app/outputs/flutter-apk/app-release.apk')
          def run(*args): return subprocess.check_output(list(map(str,args)),text=True,encoding='utf-8')
          badging=run(tools/('aapt'+suffix),'dump','badging',apk)
          cert=run(tools/signer,'verify','--print-certs',apk)
          resources=run(tools/('aapt'+suffix),'dump','--values','resources',apk)
          assert "name='com.example.fyp_flutter'" in badging
          assert f"versionName='{os.environ['EXPECTED_VERSION']}'" in badging
          assert f"versionCode='{os.environ['EXPECTED_CODE']}'" in badging
          assert 'application-debuggable' not in badging and 'android.permission.POST_NOTIFICATIONS' in badging
          assert 'CN=Android Debug' in cert, 'Expected Debug certificate'
          assert 'fyp-tar' in resources and '1:461473496985:android:ab53d01f9df4f739225d08' in resources
          api=False
          with ZipFile(apk) as z:
              for name in z.namelist():
                  data=z.read(name)
                  patterns=[rb'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----[\s\S]{32,10000}?-----END (?:RSA |EC |OPENSSH )?PRIVATE KEY-----',rb'"type"\s*:\s*"service_account"',rb'"private_key"\s*:\s*"-----BEGIN',rb'AccountKey=[A-Za-z0-9+/]{40,}={0,2}',rb'postgres(?:ql)?(?:\+\w+)?://[^\s/:]+:[^\s/@]+@',rb'(?:JWT_SECRET_KEY|SUPABASE_SERVICE_ROLE_KEY|FIREBASE_SERVICE_ACCOUNT_JSON)\s*[=:]\s*[\w/+.-]{20,}']
                  assert not any(re.search(p,data) for p in patterns), 'Potential server credential detected; refusing publication'
                  for payload in re.findall(rb'eyJ[A-Za-z0-9_-]+\.([A-Za-z0-9_-]+)\.[A-Za-z0-9_-]+',data):
                      try: role=json.loads(base64.urlsafe_b64decode(payload+b'='*(-len(payload)%4))).get('role')
                      except Exception: continue
                      assert role!='service_role', 'Server role JWT detected'
                  if name.endswith('/libapp.so'): api |= b'https://api.smartsystem.live' in data
          assert api, 'Production API absent from Dart binary'
          target=apk.with_name(f"smart-attendance-v{os.environ['EXPECTED_VERSION']}-debug-signed.apk")
          apk.rename(target)
          target.with_suffix('.apk.sha256').write_text(hashlib.sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n')
          print('Verified Debug-signed demo APK: version, Firebase, API, signature and credential scan passed.')
          PY
      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: smart-attendance-v${{ steps.prepare.outputs.version }}-debug-signed
          path: |
            fyp_flutter/build/app/outputs/flutter-apk/*-debug-signed.apk
            fyp_flutter/build/app/outputs/flutter-apk/*-debug-signed.apk.sha256
          if-no-files-found: error
      - name: Create draft, upload assets, then publish
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
            --title "Smart Attendance $GITHUB_REF_NAME — Debug-signed FYP demo" \
            --notes 'Release-mode APK with Android Debug signature for FYP demonstration and manual installation. Not production-signed, not for Google Play. Backend: https://api.smartsystem.live. A changed certificate requires uninstalling the old APK, removing local app data.'
          gh release upload "$GITHUB_REF_NAME" fyp_flutter/build/app/outputs/flutter-apk/*-debug-signed.apk fyp_flutter/build/app/outputs/flutter-apk/*-debug-signed.apk.sha256
          gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Clean temporary client and signing files
        if: always()
        run: rm -f -- fyp_flutter/android/app/google-services.json "$HOME/.android/debug.keystore"
