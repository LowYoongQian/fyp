# Azure Frontend Deployment
# 自动触发：push 到 main 且前端代码变更
# 手动触发：也可以手动运行

name: Azure Frontend Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'fyp_web/**'
      - '.github/workflows/azure-frontend-deploy.yml'
  workflow_dispatch:  # 保留手动触发选项
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20.x'
  APP_LOCATION: '/fyp_web'
  OUTPUT_LOCATION: 'dist'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: fyp_web/package-lock.json

      - name: Install dependencies
        working-directory: ./fyp_web
        run: npm ci

      - name: Build application
        working-directory: ./fyp_web
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.smartsystem.live

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ env.APP_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
          skip_app_build: true  # Already built above
