# Build and Push Docker Image to ACR
# 每次 push 到 main 分支自动触发构建

name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'fyp-backend/**'
      - 'Dockerfile'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:  # 保留手动触发选项

env:
  REGISTRY_NAME: yss2026fyp
  IMAGE_NAME: fyp-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.REGISTRY_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest -f Dockerfile .
          docker push ${{ env.REGISTRY_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
          echo "✅ 镜像已推送到 ACR"
