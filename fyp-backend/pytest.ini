[pytest]
testpaths = tests
# The app is imported as top-level modules (db.models, routers.*, domain.*), which
# only resolves if fyp-backend/ itself is on sys.path. Tests live one level down, so
# say so here rather than making each file patch sys.path.
pythonpath = .
# Only test_*, NOT the check_* functions in test_backend_fixes.py. Those talk to the
# real database -- one deliberately probes a UNIQUE constraint by INSERTing inside a
# nested transaction it rolls back -- so they stay behind that file's own main(), which
# skips them when no database is reachable. Collecting them here would fire writes at
# whatever DATABASE_URL happens to be set, which for this project is production.
# Run them deliberately:  python tests/test_backend_fixes.py
python_functions = test_*
