server {
    listen PORT_PLACEHOLDER;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite filenames contain a content hash, so they are safe to retain for a year.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The SPA shell must revalidate so a deployment immediately points at new hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob:; script-src 'self' http: https: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' http: https: 'unsafe-inline'; font-src 'self' http: https: data:; img-src 'self' http: https: data: blob:; connect-src 'self' http: https: wss: ws:; worker-src 'self' blob:;" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob:; script-src 'self' http: https: 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' http: https: 'unsafe-inline'; font-src 'self' http: https: data:; img-src 'self' http: https: data: blob:; connect-src 'self' http: https: wss: ws:; worker-src 'self' blob:;" always;
    }
}
